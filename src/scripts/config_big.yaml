reference_date: "2026-08-10"

# ============================================================
# НАСТРОЙКИ ГЕНЕРАЦИИ
# ============================================================
settings:
  duration_seconds: 300.0      # длительность каждой записи ЭКГ (сек)
  db_path: "../data/ecg_big.db"    # путь к БД (относительно папки scripts/)
  store_raw_data: true         # сохранять raw_data в БД
  seed: 42                     # зерно генератора; null = каждый раз по-разному

# ============================================================
# БИБЛИОТЕКА ПРОФИЛЕЙ (сценариев заполнения)
# Ограничение: максимум 100 лет (36525 дней) или 20000 записей
# ============================================================
profiles:
  regular_mwf_morning:
    extent: { total_records: 15600 }    # ~100 лет × 3 дня/неделю (было 100000)
    days: { type: weekdays, weekdays: [mon, wed, fri] }
    times_per_day: 1
    slots: [morning]

  random_3_per_week:
    extent: { total_records: 15600 }    # ~100 лет × 3 дня/неделю (было 100000)
    days: { type: random_days_per_week, count: 3 }
    times_per_day: 1
    slots: random

  summer_daily_morning:
    extent: { season: summer }          # ~10 лет лет (без изменений)
    days: { type: every_day }
    times_per_day: 1
    slots: [morning]

  summer_daily_random:
    extent: { season: summer }          # ~10 лет лет
    days: { type: every_day }
    times_per_day: 1
    slots: random

  month_3x_fixed:
    extent: { period_days: 3650 }       # 10 лет (было 30 дней)
    days: { type: every_day }
    times_per_day: 3
    slots: [morning, lunch, evening]

  month_3x_random:
    extent: { period_days: 3650 }       # 10 лет (было 30 дней)
    days: { type: every_day }
    times_per_day: 3
    slots: random

  century_monday:
    extent: { period_days: 5200 }       # ~100 лет, только понедельники
    days: { type: weekdays, weekdays: [mon] }
    times_per_day: 1
    slots: [morning]

  century_random_day:
    extent: { period_days: 5200 }       # ~100 лет, случайный день
    days: { type: random_days_per_week, count: 1 }
    times_per_day: 1
    slots: [morning]

  intensive_2x_day:
    extent: { period_days: 3650 }       # 10 лет (было 9000 дней = 25 лет)
    days: { type: every_day }
    times_per_day: 2
    slots: [morning, evening]

  training_weekdays:
    extent: { period_days: 1825 }       # 5 лет (было 180 дней)
    days: { type: weekdays, weekdays: [mon, tue, wed, thu, fri] }
    times_per_day: 1
    slots: [morning]

  chaotic:
    extent: { period_days: 3650 }       # 10 лет (было 547 дней)
    days: { type: random_gap, min_days: 1, max_days: 10 }
    times_per_day: 1
    slots: random

  weekends_only:
    extent: { period_days: 3650 }       # 10 лет (было 365 дней)
    days: { type: weekdays, weekdays: [sat, sun] }
    times_per_day: 1
    slots: [morning]

# ============================================================
# КОМАНДА: каждый спортсмен ссылается на профиль по имени
# ============================================================
team:
  - { birth_year: 2008, gender: M, profile: regular_mwf_morning }
  - { birth_year: 2010, gender: F, profile: random_3_per_week }
  - { birth_year: 2005, gender: M, profile: summer_daily_morning }
  - { birth_year: 2012, gender: F, profile: summer_daily_random }
  - { birth_year: 2006, gender: M, profile: month_3x_fixed }
  - { birth_year: 2009, gender: F, profile: month_3x_random }
  - { birth_year: 2004, gender: M, profile: century_monday }
  - { birth_year: 2011, gender: F, profile: century_random_day }
  - { birth_year: 2003, gender: M, profile: intensive_2x_day }
  - { birth_year: 2007, gender: M, profile: training_weekdays }
  - { birth_year: 2013, gender: F, profile: chaotic }
  - { birth_year: 2002, gender: M, profile: weekends_only }