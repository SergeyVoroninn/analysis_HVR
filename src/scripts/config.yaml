reference_date: "2026-08-10"

# ============================================================
# НАСТРОЙКИ ГЕНЕРАЦИИ
# ============================================================
settings:
  duration_seconds: 300.0      # длительность каждой записи ЭКГ (сек)
  db_path: "data/ecg.db"    # путь к БД (относительно папки scripts/)
  store_raw_data: true         # сохранять raw_data в БД
  seed: 42                     # зерно генератора; null = каждый раз по-разному


# ============================================================
# БИБЛИОТЕКА ПРОФИЛЕЙ (сценариев заполнения)
# ============================================================
profiles:
  regular_mwf_morning:
    extent: { total_records: 1000 }
    days: { type: weekdays, weekdays: [mon, wed, fri] }
    times_per_day: 1
    slots: [morning]

  random_3_per_week:
    extent: { total_records: 1000 }
    days: { type: random_days_per_week, count: 3 }
    times_per_day: 1
    slots: random

  summer_daily_morning:
    extent: { season: summer }
    days: { type: every_day }
    times_per_day: 1
    slots: [morning]

  summer_daily_random:
    extent: { season: summer }
    days: { type: every_day }
    times_per_day: 1
    slots: random

  month_3x_fixed:
    extent: { period_days: 30 }
    days: { type: every_day }
    times_per_day: 3
    slots: [morning, lunch, evening]

  month_3x_random:
    extent: { period_days: 30 }
    days: { type: every_day }
    times_per_day: 3
    slots: random

  two_years_monday:
    extent: { period_days: 730 }
    days: { type: weekdays, weekdays: [mon] }
    times_per_day: 1
    slots: [morning]

  two_years_random_day:
    extent: { period_days: 730 }
    days: { type: random_days_per_week, count: 1 }
    times_per_day: 1
    slots: [morning]

  intensive_2x_day:
    extent: { period_days: 90 }
    days: { type: every_day }
    times_per_day: 2
    slots: [morning, evening]

  training_weekdays:
    extent: { period_days: 180 }
    days: { type: weekdays, weekdays: [mon, tue, wed, thu, fri] }
    times_per_day: 1
    slots: [morning]

  chaotic:
    extent: { period_days: 547 }
    days: { type: random_gap, min_days: 1, max_days: 10 }
    times_per_day: 1
    slots: random

  weekends_only:
    extent: { period_days: 365 }
    days: { type: weekdays, weekdays: [sat, sun] }
    times_per_day: 1
    slots: [morning]

# ============================================================
# КОМАНДА: каждый спортсмен ссылается на профиль по имени
# ============================================================
team:
  - { birth_year: 2008, gender: M, profile: regular_mwf_morning }
  - { birth_year: 2010, gender: F, profile: random_3_per_week }
  - { birth_year: 2005, gender: M, profile: summer_daily_morning }
  - { birth_year: 2012, gender: F, profile: summer_daily_random }
  - { birth_year: 2006, gender: M, profile: month_3x_fixed }
  - { birth_year: 2009, gender: F, profile: month_3x_random }
  - { birth_year: 2004, gender: M, profile: two_years_monday }
  - { birth_year: 2011, gender: F, profile: two_years_random_day }
  - { birth_year: 2003, gender: M, profile: intensive_2x_day }
  - { birth_year: 2007, gender: M, profile: training_weekdays }
  - { birth_year: 2013, gender: F, profile: chaotic }
  - { birth_year: 2002, gender: M, profile: weekends_only }